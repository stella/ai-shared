name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-script:
    name: sync script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test scripts/tooling-adoption.test.ts
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Run sync regressions
        run: bash scripts/test-sync-ai-skills.sh
      - name: Validate shared skills
        run: bun scripts/validate-skills.ts skills
      - name: Run skill validation tests
        run: bun test scripts/validate-skills.test.ts
