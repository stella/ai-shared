name: Validate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-script:
    name: sync script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      - name: Detect toolchain changes
        id: toolchain
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          result=$(bunx --no-install stll-toolchain-changed --since "${BASE_SHA:-HEAD^}")
          echo "changed=$(printf '%s' "$result" | jq -r '.changed')" >> "$GITHUB_OUTPUT"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:typecheck-parity
        if: steps.toolchain.outputs.changed == 'true'
      - run: bun test scripts/tooling-adoption.test.ts
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Run sync regressions
        run: bash scripts/test-sync-ai-skills.sh
      - name: Validate shared skills
        run: bun scripts/validate-skills.ts skills
      - name: Run skill validation tests
        run: bun test scripts/validate-skills.test.ts

  oxfmt:
    name: oxfmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      - name: Check formatting
        run: bun run format:check

  ci-result:
    if: always()
    needs: [sync-script, oxfmt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every validation job
        env:
          SYNC_SCRIPT_RESULT: ${{ needs.sync-script.result }}
          OXFMT_RESULT: ${{ needs.oxfmt.result }}
        run: |
          test "$SYNC_SCRIPT_RESULT" = success
          test "$OXFMT_RESULT" = success
